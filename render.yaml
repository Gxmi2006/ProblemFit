services:
  - type: web
    name: problemfit-api
    runtime: python
    plan: free
    rootDir: problemfit/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_ENV
        value: production
      - key: MONGODB_DB
        value: problemfit
